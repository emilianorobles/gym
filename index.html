<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<title>Rutina</title>
<style>
:root{--ink:#0E0B10;--surf:#181322;--surf2:#221A2E;--line:#332843;
 --pf:#A855C4;--volt:#E4F14E;--amber:#F2A03D;--cyan:#4ED8E0;
 --tx:#F4EFF7;--mut:#9C8FAA;--dim:#6B6076;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--tx);
 font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
 padding-bottom:80px;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
header{position:sticky;top:0;z-index:30;background:rgba(14,11,16,.94);backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.day{background:var(--surf);border:1px solid transparent;border-radius:11px;padding:8px 2px;text-align:center;cursor:pointer;transition:.12s}
.day b{display:block;font-size:15px;font-weight:800;letter-spacing:.04em}
.day s{display:block;text-decoration:none;font-size:9px;color:var(--dim);margin-top:1px}
.day[aria-selected=true]{background:var(--pf);border-color:var(--pf)}
.day[aria-selected=true] s{color:rgba(255,255,255,.8)}
.phase{display:flex;gap:5px;margin-top:8px;background:var(--surf);border-radius:11px;padding:3px}
.phase button{flex:1;background:none;border:0;color:var(--mut);font:600 12px/1 inherit;padding:9px 4px;border-radius:9px;cursor:pointer}
.phase button[aria-pressed=true]{background:var(--surf2);color:var(--volt);box-shadow:inset 0 0 0 1px var(--line)}
/* barra de progreso */
.prog{display:flex;align-items:center;gap:9px;padding:9px 0 8px}
.track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:var(--volt);border-radius:2px;transition:width .35s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 8px -1px var(--volt)}
.pct{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.08em;min-width:44px;text-align:right}
.meta{padding:16px 14px 4px}
.meta h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.meta p{margin:5px 0 0;color:var(--mut);font-size:13px}
.watch{margin:12px 14px 0;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.watch .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.blk{flex:1;min-width:120px;background:var(--surf2);border-radius:10px;padding:9px 11px}
.blk .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
.blk .n span{font-size:12px;color:var(--mut);font-weight:600}
.warn{margin-top:9px;background:rgba(242,160,61,.12);border:1px solid rgba(242,160,61,.4);border-radius:10px;
 padding:9px 11px;font-size:12px;line-height:1.45;color:#F7C489}
.warn b{color:var(--amber)}
main{padding:18px 14px 0}
.card{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:opacity .15s,border-color .15s,box-shadow .15s}
.card.now{border-color:var(--pf);box-shadow:0 0 0 1px var(--pf),0 8px 28px -14px var(--pf)}
.card.done{opacity:.42}
.card::before{content:"";position:absolute;left:-14px;top:22px;bottom:22px;width:2px;background:var(--line)}
.card.done::before{background:var(--volt)}
.card.now::before{background:var(--pf)}
.card.swapped{border-left:3px solid var(--amber)}
.card.aux{background:#15111E}
.card.grab{opacity:1;z-index:25;box-shadow:0 18px 40px -12px #000,0 0 0 1px var(--pf);cursor:grabbing;transition:none}
.top{display:flex;align-items:flex-start;gap:10px}
.idx{font-size:11px;font-weight:800;color:var(--dim);padding-top:4px;min-width:26px;letter-spacing:.06em}
.idx.aux{color:var(--cyan);font-size:9px}
.nm{flex:1;min-width:0}
.nm h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.nm em{font-style:normal;display:block;font-size:11px;color:var(--dim);margin-top:2px}
.grip{flex:0 0 auto;width:40px;height:40px;margin:-8px -6px 0 0;border:0;background:none;cursor:grab;
 display:flex;align-items:center;justify-content:center;touch-action:none;color:var(--dim)}
.grip:active{cursor:grabbing;color:var(--pf)}
.grip i{display:block;width:14px;height:2px;background:currentColor;border-radius:2px;
 box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor}
.tag{display:inline-block;background:var(--amber);color:#1B1206;font-size:9px;font-weight:800;
 letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:5px;margin-bottom:5px}
.eq{margin:8px 0 0;font-size:12px;color:var(--mut)}
.spec{display:flex;gap:14px;margin:12px 0 0;align-items:baseline}
.spec .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.spec .big i{font-style:normal;color:var(--dim);font-weight:600;font-size:19px}
.spec .big u{text-decoration:none;font-size:15px;color:var(--dim);font-weight:600}
.spec .side{font-size:12px;color:var(--mut);line-height:1.35}
.spec .side b{color:var(--volt);font-weight:700}
.rut{margin:11px 0 0;font-size:13px;color:var(--mut);line-height:1.5;background:var(--surf2);padding:10px 12px;border-radius:10px}
.swap{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.swap .lbl{margin-bottom:7px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1 1 30%;min-width:0;background:var(--surf2);border:1.5px solid var(--line);border-radius:10px;
 color:var(--mut);font:600 11px/1.25 inherit;padding:9px 8px;cursor:pointer;text-align:left;transition:.12s}
.chip:active{transform:scale(.96)}
.chip u{display:block;text-decoration:none;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.chip[aria-pressed=true]{background:var(--pf);border-color:var(--pf);color:#fff}
.chip[aria-pressed=true] u{color:rgba(255,255,255,.75)}
.sets{display:flex;gap:7px;margin-top:13px}
.set{flex:1;height:52px;border-radius:11px;border:1.5px solid var(--line);background:var(--surf2);
 color:var(--dim);font:800 17px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.set:active{transform:scale(.94)}
.set[aria-pressed=true]{background:var(--volt);border-color:var(--volt);color:#14140A}
.set.wide{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.wt{display:flex;align-items:center;gap:9px;margin-top:11px}
.wt input{flex:1;min-width:0;background:var(--surf2);border:1.5px solid var(--line);border-radius:10px;
 color:var(--tx);font:700 17px/1 inherit;padding:12px}
.wt input:focus{outline:none;border-color:var(--pf)}
.wt span{font-size:11px;color:var(--dim);white-space:nowrap;max-width:44%}
details{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
summary{list-style:none;cursor:pointer;font-size:12px;color:var(--pf);font-weight:600}
summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--mut)}
.det{font-size:13px;color:var(--mut);line-height:1.5;margin-top:9px}
.det h4{margin:11px 0 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.det ul{margin:0;padding-left:17px}.det li{margin:3px 0}
.det .first{background:var(--surf2);border-left:2px solid var(--volt);padding:9px 11px;border-radius:0 8px 8px 0;color:var(--tx)}
footer{padding:6px 14px 30px;text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.reset{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:11px 18px;font:600 12px/1 inherit;cursor:pointer}
.unit{display:flex;gap:3px;background:var(--surf);border-radius:9px;padding:2px}
.unit button{border:0;background:none;color:var(--dim);font:700 11px/1 inherit;padding:6px 9px;border-radius:7px;cursor:pointer}
.unit button[aria-pressed=true]{background:var(--surf2);color:var(--volt)}
.stp{flex:0 0 46px;height:46px;border-radius:11px;border:1.5px solid var(--line);background:var(--surf2);
 color:var(--tx);font:800 20px/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stp:active{transform:scale(.92)}
.tri{margin-top:11px;display:grid;gap:7px}
.tri .fila{display:flex;align-items:center;gap:8px}
.tri .fila .lbl{min-width:40px}
.tri input{width:74px;background:var(--surf2);border:1.5px solid var(--line);border-radius:10px;
 color:var(--tx);font:700 16px/1 inherit;padding:11px 4px;text-align:center}
.tri input:focus{outline:none;border-color:var(--pf)}
.ultima{font-size:11px;color:var(--dim)}
.zrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.zrow input{width:64px;background:var(--surf2);border:1.5px solid var(--line);border-radius:10px;
 color:var(--tx);font:700 16px/1 inherit;padding:10px 4px;text-align:center}
.zrow input:focus{outline:none;border-color:var(--pf)}
.zhint{margin:8px 0 0;font-size:11px;color:var(--dim);line-height:1.45}
.fx{position:fixed;inset:0;z-index:94;pointer-events:none}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:var(--surf2);border:1px solid var(--volt);
 color:var(--tx);font:800 16px/1 inherit;padding:13px 22px;border-radius:14px;z-index:95;white-space:nowrap;
 box-shadow:0 14px 40px -10px #000;animation:brinca .35s cubic-bezier(.2,.8,.3,1.4)}
@keyframes brinca{from{opacity:0;transform:translateX(-50%) scale(.7)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="days" id="days" role="tablist"></div>
  <div class="phase" role="group">
    <button id="pA" aria-pressed="true">Semanas 1–2</button>
    <button id="pB" aria-pressed="false">Semana 3 en adelante</button>
  </div>
  <div class="prog">
    <div class="unit" role="group" aria-label="Unidad de peso">
      <button id="uKg" aria-pressed="true">kg</button><button id="uLb" aria-pressed="false">lb</button>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div><span class="pct" id="pct">0/0</span>
  </div>
</header>
<div class="meta"><h1 id="ttl"></h1><p id="sub"></p></div>
<div class="watch"><div class="lbl">Apple Watch · bloques de hoy</div><div class="row" id="watch"></div><div id="aviso"></div>
  <details id="zdet"><summary>Zona 2 de tu reloj ⚙</summary>
    <div class="zrow">
      <button class="stp" data-zf="z2min" data-stp="-1" aria-label="Bajar mínimo">−</button>
      <input id="z2min" type="number" inputmode="numeric" min="0" placeholder="min">
      <button class="stp" data-zf="z2min" data-stp="1" aria-label="Subir mínimo">+</button>
      <span>a</span>
      <button class="stp" data-zf="z2max" data-stp="-1" aria-label="Bajar máximo">−</button>
      <input id="z2max" type="number" inputmode="numeric" min="0" placeholder="max">
      <button class="stp" data-zf="z2max" data-stp="1" aria-label="Subir máximo">+</button>
      <span>lpm</span>
    </div>
    <p class="zhint">Cópiala una sola vez de tu iPhone: app Watch → Entrenamiento → Zonas de frecuencia cardiaca. Las tarjetas de cardio usarán estos números en lugar de la estimación por edad.</p>
  </details>
</div>
<main id="main"></main>
<footer>
  <button class="reset" id="orden">Restaurar orden original</button>
  <button class="reset" id="reset">Reiniciar el día</button>
  <button class="reset" id="exportar">Exportar mis datos</button>
</footer>
<script>
function iniciar(DATA){
const EX = Object.fromEntries(DATA.ejercicios.map(e=>[e.id,e]));
const DAYS = DATA.dias.filter(d=>d.dia!=='sabado-o-domingo');
const ABBR = {lunes:['LUN','Inferior A'],martes:['MAR','Superior A'],miercoles:['MIÉ','Cardio'],jueves:['JUE','Inferior B'],viernes:['VIE','Superior B']};
const AUX = {calentamiento:'CAL', cardio:'CAR', enfriamiento:'ENF'};
const CHIPS = new Set(['compuesto','aislamiento','core','cardio']);
const today = () => new Date().toLocaleDateString('sv');
const jsDay = ['','lunes','martes','miercoles','jueves','viernes'][new Date().getDay()] || 'lunes';

// Estado en memoria primero; localStorage como mejor esfuerzo. Si escribir truena
// (file://, modo privado, cuota), la UI sigue funcionando en la sesión.
const mem={};
try{ for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); mem[k]=localStorage.getItem(k);} }catch(e){}
const lee=k=> k in mem ? mem[k] : null;
const guarda=(k,v)=>{mem[k]=String(v); try{localStorage.setItem(k,v)}catch(e){}};
const borra=k=>{delete mem[k]; try{localStorage.removeItem(k)}catch(e){}};

let fase = lee('fase') || 'adaptacion';
let unidad = lee('unidad') || 'kg';
let zonas = null; try{ zonas=JSON.parse(lee('zonas')||'null') }catch(e){}
let dia  = jsDay, primeraCarga = true;

const LB=2.20462262;
const aKg=lb=>Math.round(lb/LB*100)/100;
const aLb=kg=>Math.round(kg*LB*2)/2;
const muestraPeso=kgStr=>{const n=parseFloat(kgStr); return isNaN(n)?kgStr:String(unidad==='lb'?aLb(n):n)};

const kSet=(d,n,i)=>`s|${d}|${n}|${i}`, kAlt=(d,n)=>`a|${d}|${n}`, kWt=id=>`w|${id}`;
const kOrd=d=>`o|${d}|${fase}`, kScr=d=>`sc|${d}`;
const getSet=(d,n,i)=>lee(kSet(d,n,i))===today();
const setSet=(d,n,i,on)=>on?guarda(kSet(d,n,i),today()):borra(kSet(d,n,i));
function getAlt(d,n){const v=lee(kAlt(d,n));if(!v)return null;const[f,id]=v.split('@');return f===today()?id:null}
const setAlt=(d,n,id)=>id?guarda(kAlt(d,n),today()+'@'+id):borra(kAlt(d,n));
const base=id=>{const e=EX[id];return(fase==='adaptacion'&&e.seriesAdaptacion===0)?EX[e.alternativas[0]]:e};

// Cardio: tres steppers que componen el mismo formato de texto de siempre ("6.5 · 10 · 5")
// bajo w|{id}. Un valor viejo de texto libre no parsea: campos vacíos y el texto en "última vez".
function tri(id,wt){
  const p=(wt||'').split('·').map(s=>parseFloat(s));
  const v=[0,1,2].map(i=>isNaN(p[i])?'':p[i]);
  const et=['vel','incl','nivel'], pasos=[0.5,1,1];
  return `<div class="tri" data-w3="${id}">
    ${et.map((t,i)=>`<div class="fila"><span class="lbl">${t}</span>
      <button class="stp" data-stp="-1" aria-label="Bajar ${t}">−</button>
      <input type="number" inputmode="decimal" step="${pasos[i]}" min="0" data-paso="${pasos[i]}" value="${v[i]}">
      <button class="stp" data-stp="1" aria-label="Subir ${t}">+</button></div>`).join('')}
    <span class="ultima">${wt?'última vez: '+wt:'primera vez'}</span></div>`;
}

function tarjeta(orig, slot, esFuerza, badge){
  const altId=getAlt(dia,slot), e=altId?EX[altId]:orig;
  const ns = esFuerza ? ((fase==='adaptacion'?orig.seriesAdaptacion:orig.series)||orig.series) : 1;
  const hechas=[...Array(ns)].filter((_,i)=>getSet(dia,slot,i)).length;
  const rango = e.repsMin===e.repsMax ? e.repsMin : e.repsMin+'–'+e.repsMax;
  const uni = e.unidadReps||'reps', rir = fase==='adaptacion'?orig.rirAdaptacion:orig.rir;
  const wt = lee(kWt(e.id));
  const esCardio = e.tipo==='cardio' || e.id==='calentamiento-cardio-suave';
  const conChips = CHIPS.has(e.tipo) || e.id==='calentamiento-cardio-suave';
  const opciones=[orig.id,...orig.alternativas], et=['Prescrito','Si está ocupado','Otra opción'];
  const big = esFuerza ? `${ns}<i> × </i>${rango}${uni!=='reps'?` <u>${uni}</u>`:''}` : `${rango} <u>${uni}</u>`;
  const zTxt = zonas ? `zona 2 · FC <b>${zonas.z2min}–${zonas.z2max}</b> lpm<br>según tu reloj`
    : 'zona 2 · hablas en frases<br>completas pero no cantas';
  const side = esFuerza ? `series × ${uni==='reps'?'reps':uni}<br>descanso <b>${orig.descansoSeg}s</b> · RIR <b>${rir}</b>`
    : (esCardio ? zTxt : 'sostenido, sin rebotes');

  return `<article class="card ${hechas===ns?'done':''} ${altId?'swapped':''} ${esFuerza?'':'aux'}"
      data-n="${slot}" data-ns="${ns}" data-desc="${orig.descansoSeg}" ${esFuerza?'data-drag="1"':''}>
    <div class="top"><div class="idx ${esFuerza?'':'aux'}">${badge}</div>
      <div class="nm">${altId?'<span class="tag">Sustituto</span>':''}
        <h2>${e.nombre.es}</h2><em>${e.nombre.en}</em></div>
      ${esFuerza?'<button class="grip" aria-label="Mover ejercicio"><i></i></button>':''}</div>
    <p class="eq">${e.equipo}</p>
    <div class="spec"><div class="big">${big}</div><div class="side">${side}</div></div>
    ${esFuerza?'':`<p class="rut">${e.notaPesoInicial}</p>`}
    ${conChips?`<div class="swap"><span class="lbl">Aparato</span><div class="chips">
      ${opciones.map((id,k)=>`<button class="chip" data-swap="${id}" aria-pressed="${id===e.id}"><u>${et[k]}</u>${EX[id].nombre.es}</button>`).join('')}
    </div></div>`:''}
    <div class="sets">${esFuerza
      ? [...Array(ns)].map((_,i)=>`<button class="set" data-i="${i}" aria-pressed="${getSet(dia,slot,i)}">${i+1}</button>`).join('')
      : `<button class="set wide" data-i="0" aria-pressed="${getSet(dia,slot,0)}">${hechas?'Hecho':'Marcar hecho'}</button>`}</div>
    ${esFuerza?`<div class="wt">
      <button class="stp" data-stp="-1" aria-label="Bajar peso">−</button>
      <input type="number" inputmode="decimal" step="0.5" min="0"
        placeholder="${unidad} de hoy" value="${wt!=null?muestraPeso(wt):''}" data-w="${e.id}">
      <button class="stp" data-stp="1" aria-label="Subir peso">+</button>
      <span class="ultima">${wt!=null?'última vez: '+muestraPeso(wt)+' '+unidad:'primera vez'}</span></div>`
    : esCardio?tri(e.id,wt):''}
    <details><summary>Técnica y errores</summary><div class="det">
      ${esFuerza?`<div class="first"><strong>Peso inicial:</strong> ${e.notaPesoInicial}</div>`:''}
      <h4>Cómo se hace</h4><ul>${e.cues.map(c=>`<li>${c}</li>`).join('')}</ul>
      <h4>Ajuste</h4><p style="margin:0">${e.ajusteMaquina}</p>
      <h4>Errores comunes</h4><ul>${e.erroresComunes.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div></details></article>`;
}

function render(restaurar){
  days.innerHTML = DAYS.map(d=>{const[a,b]=ABBR[d.dia];
    return `<button class="day" role="tab" data-d="${d.dia}" aria-selected="${d.dia===dia}"><b>${a}</b><s>${b}</s></button>`}).join('');
  pA.setAttribute('aria-pressed',fase==='adaptacion'); pB.setAttribute('aria-pressed',fase!=='adaptacion');
  uKg.setAttribute('aria-pressed',unidad==='kg'); uLb.setAttribute('aria-pressed',unidad==='lb');
  const d = DAYS.find(x=>x.dia===dia);
  ttl.textContent=d.enfoque;
  sub.textContent=`${d.horaRecomendada}  ·  respaldo ${d.horaRespaldo||'—'}  ·  ${d.duracionTotalMin} min`;
  const aw=d.appleWatch?(fase==='adaptacion'?d.appleWatch.bloquesAdaptacion:d.appleWatch.bloques):[];
  watch.innerHTML = aw.length
    ? aw.map((b,i)=>`<div class="blk"><div class="lbl">Bloque ${i+1}</div><div class="n">⟳ ${b.series} <span>· ${b.descansoSeg}s</span></div></div>`).join('')
    : '<div class="blk"><div class="n" style="font-size:14px">Sin bloques</div></div>';

  // construir items en orden natural, luego aplicar el orden guardado a los de fuerza
  let slot=0, num=0, items=[];
  d.bloques.forEach(b=>b.ejercicios.forEach(rawId=>{
    slot++; const esFuerza=b.tipo==='principal'; const orig=base(rawId);
    items.push({slot, esFuerza, orig, badge: esFuerza?String(++num).padStart(2,'0'):AUX[b.tipo]});
  }));
  const guardado = JSON.parse(lee(kOrd(dia))||'null');
  if(guardado){
    const fuerza = items.filter(i=>i.esFuerza);
    const ord = guardado.filter(s=>fuerza.some(i=>i.slot===s))
              .concat(fuerza.filter(i=>!guardado.includes(i.slot)).map(i=>i.slot));
    let k=0; items = items.map(i=> i.esFuerza ? fuerza.find(f=>f.slot===ord[k++]) : i);
  }
  main.innerHTML = items.map(i=>tarjeta(i.orig,i.slot,i.esFuerza,i.badge)).join('');
  marca(); progreso(); avisoOrden();
  if(restaurar){ const y=+lee(kScr(dia))||0; requestAnimationFrame(()=>scrollTo(0,y)); }
}
function marca(){const c=[...main.querySelectorAll('.card')];c.forEach(x=>x.classList.remove('now'));
  (c.find(x=>!x.classList.contains('done'))||{classList:{add(){}}}).classList.add('now')}
function progreso(){
  const tot=[...main.querySelectorAll('.set')], hechos=tot.filter(x=>x.getAttribute('aria-pressed')==='true').length;
  fill.style.width = tot.length ? (hechos/tot.length*100)+'%' : '0%';
  pct.textContent = `${hechos}/${tot.length}`;
}
function avisoOrden(){
  const d=[...main.querySelectorAll('.card[data-drag]')].map(c=>+c.dataset.desc);
  let roto=false; for(let i=1;i<d.length;i++) if(d[i]>d[i-1]) roto=true;
  aviso.innerHTML = roto
    ? `<div class="warn"><b>Ojo:</b> mezclaste ejercicios de 90 s y de 60 s. Los bloques de tu Apple Watch van en orden (primero todos los de 90 s), así que el descanso que te marque ya no va a coincidir. Reordena dentro del mismo grupo, o guíate por el descanso que dice cada tarjeta.</div>` : '';
}

let drag=null;
main.addEventListener('pointerdown', ev=>{
  const g=ev.target.closest('.grip'); if(!g) return;
  ev.preventDefault();
  const card=g.closest('.card');
  drag={card, y:ev.clientY};
  card.classList.add('grab');
  g.setPointerCapture(ev.pointerId);
  if(navigator.vibrate) navigator.vibrate(10);
},{passive:false});
main.addEventListener('pointermove', ev=>{
  if(!drag) return; ev.preventDefault();
  const dy=ev.clientY-drag.y;
  drag.card.style.transform=`translateY(${dy}px)`;
  const r=drag.card.getBoundingClientRect(), mid=r.top+r.height/2;
  for(const s of main.querySelectorAll('.card[data-drag]')){
    if(s===drag.card) continue;
    const q=s.getBoundingClientRect();
    if(mid>q.top && mid<q.bottom){
      const abajo = drag.card.compareDocumentPosition(s) & Node.DOCUMENT_POSITION_FOLLOWING;
      s.parentNode.insertBefore(drag.card, abajo ? s.nextSibling : s);
      drag.y=ev.clientY; drag.card.style.transform='';
      if(navigator.vibrate) navigator.vibrate(6);
      break;
    }
  }
},{passive:false});
function soltar(){
  if(!drag) return;
  drag.card.classList.remove('grab'); drag.card.style.transform='';
  guarda(kOrd(dia), JSON.stringify([...main.querySelectorAll('.card[data-drag]')].map(c=>+c.dataset.n)));
  drag=null; marca(); avisoOrden();
}
addEventListener('pointerup',soltar); addEventListener('pointercancel',soltar);

function pintaUltima(cont,txt){ const s=cont.querySelector('.ultima'); if(s) s.textContent=txt; }
function guardaPesoFuerza(inp){
  const v=inp.value.trim(), id=inp.dataset.w;
  if(!v){ borra(kWt(id)); pintaUltima(inp.closest('.wt'),'primera vez'); return; }
  const n=parseFloat(v); if(isNaN(n)) return;
  const kg = unidad==='lb' ? aKg(n) : Math.round(n*100)/100;
  guarda(kWt(id), kg);
  pintaUltima(inp.closest('.wt'),'última vez: '+muestraPeso(String(kg))+' '+unidad);
}
function guardaCardio(cont){
  const id=cont.dataset.w3, vals=[...cont.querySelectorAll('input')].map(i=>i.value.trim());
  if(vals.every(v=>!v)){ borra(kWt(id)); pintaUltima(cont,'primera vez'); return; }
  const txt=vals.map(v=>v||'–').join(' · ');
  guarda(kWt(id), txt);
  pintaUltima(cont,'última vez: '+txt);
}

main.addEventListener('click', ev=>{
  const st=ev.target.closest('.stp');
  if(st){
    const inp=st.parentElement.querySelector('input');
    const paso = inp.dataset.w ? (unidad==='lb'?5:2.5) : (+inp.dataset.paso||1);
    inp.value=Math.max(0, Math.round(((parseFloat(inp.value)||0)+(+st.dataset.stp)*paso)*4)/4);
    inp.dataset.w ? guardaPesoFuerza(inp) : guardaCardio(inp.closest('.tri'));
    if(navigator.vibrate) navigator.vibrate(6);
    return;
  }
  const chip=ev.target.closest('.chip');
  if(chip){
    const card=chip.closest('.card'), n=+card.dataset.n;
    const orig=chip.parentElement.firstElementChild.dataset.swap;
    setAlt(dia,n, chip.dataset.swap===orig?null:chip.dataset.swap);
    if(navigator.vibrate) navigator.vibrate(12);
    const y=card.getBoundingClientRect().top; render(false);
    const nc=main.querySelector(`.card[data-n="${n}"]`);
    if(nc) scrollBy(0, nc.getBoundingClientRect().top-y);
    return;
  }
  const b=ev.target.closest('.set'); if(!b) return;
  const card=b.closest('.card'), n=+card.dataset.n, i=+b.dataset.i, ns=+card.dataset.ns;
  const on=b.getAttribute('aria-pressed')!=='true';
  b.setAttribute('aria-pressed',on); setSet(dia,n,i,on);
  if(b.classList.contains('wide')) b.textContent = on?'Hecho':'Marcar hecho';
  const hechas=[...card.querySelectorAll('.set')].filter(x=>x.getAttribute('aria-pressed')==='true').length;
  card.classList.toggle('done', hechas===ns);
  marca(); progreso();
  if(navigator.vibrate) navigator.vibrate(on?18:8);
  if(on){ const t=[...main.querySelectorAll('.set')];
    if(t.length && t.every(x=>x.getAttribute('aria-pressed')==='true')) celebra(); }
});

// Sin sonido a propósito; el gym ya suena suficiente. Solo dispara en la transición
// a día completo (nunca al cargar), y con reduced-motion queda solo el toast.
function celebra(){
  const toast=document.createElement('div'); toast.className='toast'; toast.textContent='¡Día completo! 💪';
  document.body.appendChild(toast); setTimeout(()=>toast.remove(),2600);
  if(navigator.vibrate) navigator.vibrate([30,60,30]);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='fx'; document.body.appendChild(cv);
  const dpr=devicePixelRatio||1, W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cols=['#E4F14E','#A855C4','#4ED8E0','#F2A03D','#F4EFF7'], p=[];
  for(let b=0;b<3;b++){
    const cx=W*(0.25+0.25*b), cy=H*(0.2+0.12*(b%2)), t0=b*260;
    for(let i=0;i<26;i++){
      const a=Math.PI*2*i/26+Math.random()*.25, v=2.2+Math.random()*2.4;
      p.push({cx,cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t0,c:cols[(Math.random()*cols.length)|0],r:1.6+Math.random()*1.7});
    }
  }
  let ini;
  requestAnimationFrame(function paso(ts){
    if(ini===undefined) ini=ts; const t=ts-ini;
    ctx.clearRect(0,0,W,H);
    for(const q of p){
      const lt=t-q.t0; if(lt<0||lt>1500) continue;
      const s=lt/16.7;
      ctx.globalAlpha=1-lt/1500; ctx.fillStyle=q.c;
      ctx.beginPath(); ctx.arc(q.cx+q.vx*s, q.cy+q.vy*s+0.045*s*s, q.r, 0, 7); ctx.fill();
    }
    t<2100 ? requestAnimationFrame(paso) : cv.remove();
  });
}

// Zona 2 real del Apple Watch (el reloj usa % de reserva de FC, no % de FCmax por edad)
function pintaZonas(){ z2min.value=zonas?zonas.z2min:''; z2max.value=zonas?zonas.z2max:''; }
function guardaZonas(){
  const a=parseInt(z2min.value), b=parseInt(z2max.value);
  if(a>0&&b>0){ zonas={z2min:a,z2max:b}; guarda('zonas',JSON.stringify(zonas)); }
  else if(!z2min.value&&!z2max.value){ zonas=null; borra('zonas'); }
  render(false);
}

});
